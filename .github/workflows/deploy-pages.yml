name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy BLST assets into public/
        run: |
          UVC=node_modules/@shutter-network/urban-verified-crypto/dist
          mkdir -p public
          cp -f "$UVC/blst.wasm" public/blst.wasm
          cp -f "$UVC/blst.js"   public/blst.js

      - name: Build
        env:
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_ELECTION_REGISTRY: ${{ vars.VITE_ELECTION_REGISTRY }}
        run: npm run build

      # The Vite-bundled SDK chunk lives in dist/assets/ and fetches
      # 'blst.wasm' relative to its own URL, so the WASM must sit next
      # to it (the copy in dist/blst.wasm from public/ is unused at
      # runtime but kept for local dev parity).
      - name: Place BLST WASM next to the Vite-bundled chunk
        run: |
          UVC=node_modules/@shutter-network/urban-verified-crypto/dist
          cp -f "$UVC/blst.wasm" dist/assets/blst.wasm

      - name: Verify BLST assets are in dist/
        run: ls -la dist/blst.wasm dist/blst.js dist/assets/blst.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
